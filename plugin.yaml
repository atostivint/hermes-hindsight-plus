manifest_version: 2
name: hermes-hindsight-plus
version: 0.2.0
description: >-
  Inject Hindsight mental models into the first turn of every conversation,
  replacing hand-maintained MEMORY.md / USER.md files with stable,
  cron-refreshed context from your Hindsight bank. Creates missing models with
  a daily refresh by default; existing models are never modified.
author: atostivint
license: MIT
homepage: https://github.com/atostivint/hermes-hindsight-plus
tags:
  - memory
  - context
  - hindsight
  - mental-models
provides_hooks:
  - pre_llm_call
config_schema:
  mode:
    type: str
    description: When to inject the mental models into the conversation.
    choices: ["first_turn", "every_turn", "off"]
    default: first_turn
  mental_model_ids:
    type: list
    description: Hindsight mental model IDs to inject, concatenated in order.
    default: ["operator-context"]
  max_chars:
    type: int
    description: Truncation budget for the assembled injection (including the marker).
    default: 6000
  cache_ttl_s:
    type: int
    description: Seconds a cached mental model stays fresh (no network call).
    default: 21600
  timeout_s:
    type: float
    description: Total wall-clock budget for the whole injection attempt (all models).
    default: 3.0
  skip_platforms:
    type: list
    description: Platforms on which no injection happens.
    default: ["cron"]
  create_missing:
    type: bool
    description: >-
      Create a configured mental model when Hindsight returns 404. Existing
      models are never updated or overwritten.
    default: true
  create_name:
    type: str
    description: Human-readable name used only when creating a missing mental model.
    default: "Stable operating context"
  create_source_query:
    type: str
    description: >-
      Query Hindsight's reflect agent uses to generate the content of a newly
      created mental model.
    default: >-
      Build a stable operating context for this assistant from the bank's durable
      memories. Cover the user's identity and preferences, environment and
      infrastructure facts, active projects and commitments, standing
      instructions, and recurring workflows. Exclude transient details, secrets,
      and anything likely to change soon. Return concise markdown with short
      sections.
  create_refresh_cron:
    type: str
    description: >-
      UTC cron schedule for refreshing newly created models (5 fields). Empty
      disables the schedule. Existing models are left untouched.
    default: "0 3 * * *"
  create_max_tokens:
    type: int
    description: Maximum tokens for content generated on a newly created model (256-8192).
    default: 2048
  create_mode:
    type: str
    description: Refresh mode used only when creating a missing mental model.
    choices: ["full", "delta"]
    default: full
